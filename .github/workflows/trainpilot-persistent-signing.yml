name: TrainPilot persistent signed APK and AAB pairs
# 2760: requested signed phone/Wear APK+AAB pair after verified PR233 (685 JVM tests); workflow checks unchanged.
# Signed verification build for UI/UX issue #219 implementation, source 23ba07fc691fbe35c46b0b7a4c313bd869c8251a.
# Verification build for health fixes #217/#218, AI Studio commit 8822fd963d7588c6197ff9e8861446850ebed120.
# 2753: device-feedback fixes PR159/160/161, verified 550 JVM tests; signed pair trigger only.
# 2751: signed main with reviewed AI Studio integration and localized profile choices.
# 2752: PR109 signed phone/Wear pair build trigger; workflow steps unchanged.
# PR110: one-time signed pair trigger after verified squash merge ac3987f3; workflow steps unchanged.
# 2753: signed phone/Wear pair after AI Studio integration passes PR #112 CI; workflow steps unchanged.
# 2753: release verification now derives both phone and Wear version values from Gradle; syntax checked before build.

# Signed pair trigger: PR #207 Home profile/planner + PR #209 active workout A/B badge placement, workflow steps unchanged.
# Signed test pair trigger: calendar cleanup main app source 31f48578f3dc73123d14f0d8e43df610576aba26, verified 595/595 JVM tests.
# Signed test pair trigger: program/exercise/quick/GPS audit source 197ed0745b9b62f480bcafa5645ed4b0a1c40260, verified 601/601 JVM tests.
# Requested signed phone/Wear APK build after verified audit, 2026-11-09.
# Signed verification build for AI Studio implementation #215/#214/#216, main d261728a3d653db1d048976b9e3971a07876a008.
# Retry after fixing barbell loadType regression assertion (606 tests, one failed in #52).
# Retry #54 after correcting home-basic day ID case in catalog regression test (#53).
on:
  workflow_dispatch:
    inputs:
      build_aab:
        description: 'Also build Play Console AABs (disable for a device-test APK pair)'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/trainpilot-persistent-signing.yml'

permissions:
  contents: read

concurrency:
  group: trainpilot-persistent-signing
  cancel-in-progress: false

jobs:
  signed-pair:
    if: github.ref == 'refs/heads/main'
    environment: android-signing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TRAINPILOT_MAPS_API_KEY: ${{ secrets.TRAINPILOT_MAPS_API_KEY || secrets.MAPS_API_KEY }}
      TRAINPILOT_REQUIRE_WEAR_PAIR: 'true'
      TRAINPILOT_VERIFY_RELEASE: 'true'
      TRAINPILOT_RELEASE_CERT_SHA256: ${{ secrets.TRAINPILOT_RELEASE_CERT_SHA256 }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate release APK verification script syntax
        run: python3 -m py_compile scripts/verify_android_apk_metadata.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36 SDK from hosted runner
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "${SDKMANAGER}"
          echo "Using ${SDKMANAGER}"
          "${SDKMANAGER}" --version
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" --install 'platforms;android-36' 'build-tools;36.0.0'
          # AGP 9.1 requests compileSdk 36.1; install it when listed.
          "${SDKMANAGER}" --install 'platforms;android-36.1' || true

      - name: Set up Gradle 9.3.1 (repo has no gradlew launcher)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          # Signed main builds seed the default-branch cache for future main/PR builds.
          # No configuration-cache encryption key is supplied: setup-gradle will not
          # persist project configuration (which may contain signing credentials).
          cache-read-only: false

      - name: Cache Robolectric Android SDK dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-api34-i7-v1-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Fetch checksum-verified Robolectric SDK with retries
        shell: bash
        run: python3 scripts/prefetch_robolectric_sdk.py

      - name: Restore private signing file into runner temporary directory
        env:
          KEYSTORE_BASE64: ${{ secrets.TRAINPILOT_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          required = ['KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_PASSWORD', 'TRAINPILOT_RELEASE_CERT_SHA256', 'TRAINPILOT_MAPS_API_KEY']
          missing = [key for key in required if not os.environ.get(key, '').strip()]
          if missing:
              raise SystemExit('Missing configuration names: ' + ', '.join(missing))
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'trainpilot-release.jks'
          with target.open('xb') as output:
              target.chmod(0o600)
              output.write(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('KEYSTORE_PATH=' + str(target) + '\n')
          PY

      - name: Build signed phone and Wear pair and run all JVM tests
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_AAB: ${{ github.event_name != 'workflow_dispatch' || inputs.build_aab }}
        shell: bash
        run: |
          tasks=(:app:assembleRelease :wear:assembleRelease)
          if [[ "$BUILD_AAB" == "true" ]]; then
            tasks+=(:app:bundleRelease :wear:bundleRelease)
          fi
          gradle --no-daemon --stacktrace --profile --continue "${tasks[@]}" :app:testDebugUnitTest :wear:testDebugUnitTest :shared:testDebugUnitTest

      - name: Verify raw phone, Wear and shared JUnit XML test results
        if: always()
        env:
          TRAINPILOT_SOURCE_SHA: ${{ github.sha }}
        run: python3 scripts/verify_junit_xml.py

      - name: Verify package, embedded Maps configuration and pinned signer
        run: python3 scripts/verify_android_apk_metadata.py

      - name: Verify signed AABs and write Play metadata
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_aab }}
        shell: bash
        run: |
          set -euo pipefail
          PHONE="app/build/outputs/bundle/release/app-release.aab"
          WEAR="wear/build/outputs/bundle/release/wear-release.aab"
          test -s "$PHONE"
          test -s "$WEAR"
          jarsigner -verify "$PHONE"
          jarsigner -verify "$WEAR"
          python3 - <<'PY'
          import os, re, subprocess
          expected = os.environ.get('TRAINPILOT_RELEASE_CERT_SHA256', '').replace(':', '').lower().strip()
          if len(expected) != 64:
              raise SystemExit('Pinned release certificate SHA-256 missing')
          for bundle in ('app/build/outputs/bundle/release/app-release.aab', 'wear/build/outputs/bundle/release/wear-release.aab'):
              out = subprocess.check_output(['keytool', '-printcert', '-jarfile', bundle], text=True, stderr=subprocess.STDOUT)
              match = re.search(r'SHA256:\s*([0-9A-Fa-f:]+)', out)
              if not match:
                  raise SystemExit(f'Unable to read signer SHA-256 from {bundle}')
              actual = match.group(1).replace(':', '').lower()
              if actual != expected:
                  raise SystemExit(f'AAB signer differs from pinned TrainPilot release key: {bundle}')
          print('AAB signatures verified against pinned TrainPilot upload certificate.')
          PY
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          def field(module, name):
              src = pathlib.Path(module, 'build.gradle.kts').read_text()
              m = re.search(rf'(?m)^\s*{name}\s*=\s*(\d+|"[^"\n]+")', src)
              if not m:
                  raise SystemExit(f'Missing {module} {name}')
              return m.group(1).strip('"')
          phone = pathlib.Path('app/build/outputs/bundle/release/app-release.aab')
          wear = pathlib.Path('wear/build/outputs/bundle/release/wear-release.aab')
          meta = {
              'commit': __import__('os').environ.get('GITHUB_SHA'),
              'applicationId': 'com.TrainPilot.com',
              'versionName': field('app', 'versionName'),
              'mobileVersionCode': int(field('app', 'versionCode')),
              'wearVersionCode': int(field('wear', 'versionCode')),
              'mobileAabSha256': hashlib.sha256(phone.read_bytes()).hexdigest(),
              'wearAabSha256': hashlib.sha256(wear.read_bytes()).hexdigest(),
              'mobileBytes': phone.stat().st_size,
              'wearBytes': wear.stat().st_size,
          }
          if meta['mobileVersionCode'] == meta['wearVersionCode']:
              raise SystemExit('Phone and Wear versionCode must be unique for Play form-factor releases')
          pathlib.Path('app/build/outputs/play-aab-metadata.json').write_text(json.dumps(meta, indent=2) + '\n')
          print(json.dumps(meta, indent=2))
          PY

      - name: Remove temporary private signing file
        if: always()
        shell: bash
        run: rm -f -- "${RUNNER_TEMP}/trainpilot-release.jks"

      - name: Upload verified signed APKs and public metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: trainpilot-persistent-signed-apk-pair
          path: |
            app/build/outputs/apk/release/app-release.apk
            wear/build/outputs/apk/release/wear-release.apk
            app/build/outputs/apk-verification.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed Play Console AAB pair
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.build_aab) }}
        uses: actions/upload-artifact@v4
        with:
          name: trainpilot-play-internal-aab-pair
          path: |
            app/build/outputs/bundle/release/app-release.aab
            wear/build/outputs/bundle/release/wear-release.aab
            app/build/outputs/play-aab-metadata.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload JVM test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainpilot-persistent-signing-test-reports
          path: |
            app/build/test-results/
            wear/build/test-results/
            shared/build/test-results/
            app/build/outputs/junit-verification.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Gradle task timing profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainpilot-build-profile
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7
