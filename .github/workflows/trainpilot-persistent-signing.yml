name: TrainPilot persistent signed APK and AAB pairs
# 2806 (1.5.0): requested full main CI and signed phone/Wear APK+AAB after PR #361; workflow steps unchanged.
# 2760: requested signed phone/Wear APK+AAB pair after verified PR233 (685 JVM tests); workflow checks unchanged.
# Signed verification build for UI/UX issue #219 implementation, source 23ba07fc691fbe35c46b0b7a4c313bd869c8251a.
# Verification build for health fixes #217/#218, AI Studio commit 8822fd963d7588c6197ff9e8861446850ebed120.
# 2753: device-feedback fixes PR159/160/161, verified 550 JVM tests; signed pair trigger only.
# 2751: signed main with reviewed AI Studio integration and localized profile choices.
# 2752: PR109 signed phone/Wear pair build trigger; workflow steps unchanged.
# PR110: one-time signed pair trigger after verified squash merge ac3987f3; workflow steps unchanged.
# 2753: signed phone/Wear pair after AI Studio integration passes PR #112 CI; workflow steps unchanged.
# 2753: release verification now derives both phone and Wear version values from Gradle; syntax checked before build.

# Signed pair trigger: PR #207 Home profile/planner + PR #209 active workout A/B badge placement, workflow steps unchanged.
# Signed test pair trigger: calendar cleanup main app source 31f48578f3dc73123d14f0d8e43df610576aba26, verified 595/595 JVM tests.
# Signed test pair trigger: program/exercise/quick/GPS audit source 197ed0745b9b62f480bcafa5645ed4b0a1c40260, verified 601/601 JVM tests.
# Requested signed phone/Wear APK build after verified audit, 2026-11-09.
# Signed verification build for AI Studio implementation #215/#214/#216, main d261728a3d653db1d048976b9e3971a07876a008.
# Retry after fixing barbell loadType regression assertion (606 tests, one failed in #52).
# Retry #54 after correcting home-basic day ID case in catalog regression test (#53).
on:
  workflow_dispatch:
    inputs:
      build_aab:
        description: 'Also build Play Console AABs (disable for a device-test APK pair)'
        type: boolean
        default: true
  # Only a completed full regression on trusted main can start automatic signing.
  workflow_run:
    workflows: ['TrainPilot Native Android Regression Tests']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: trainpilot-persistent-signing
  cancel-in-progress: false

jobs:
  release-source:
    name: Verify trusted full regression source
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
        )
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      source_sha: ${{ steps.validate.outputs.source_sha }}
    steps:
      - name: Validate original main SHA and required full CI steps
        id: validate
        uses: actions/github-script@v9.0.0
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('source_sha', context.sha);
              return;
            }

            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const { data: main } = await github.rest.repos.getBranch({
              owner, repo, branch: 'main'
            });
            if (main.commit.sha !== run.head_sha) {
              core.notice('Skipping outdated CI source: main advanced since the regression.');
              return;
            }

            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: run.id, per_page: 100
            });
            const jvm = data.jobs.find(job =>
              job.name === 'Compile and full JVM regressions' &&
              job.conclusion === 'success' &&
              job.steps?.some(step =>
                step.name === 'Verify raw phone, Wear and shared JUnit XML test results' &&
                step.conclusion === 'success'
              )
            );
            const passedStep = (jobName, stepName) => data.jobs.some(job =>
              job.name === jobName &&
              job.conclusion === 'success' &&
              job.steps?.some(step => step.name === stepName && step.conclusion === 'success')
            );
            const shards = ['phone-a', 'phone-b', 'wear-shared'].every(suite =>
              passedStep(`JVM regressions (${suite})`, 'Compile and run module JVM tests')
            );
            const r8 = ['app', 'wear'].every(module =>
              passedStep(`Release R8 minification check (${module})`, 'Run release R8 minification')
            );
            const dex = passedStep('Kyant debug DEX compatibility', 'Verify debug D8 dexing without signing');
            if (!jvm || !shards || !r8 || !dex) {
              core.notice('No signed build: full raw JVM verification, both R8 jobs and debug DEX must pass.');
              return;
            }
            core.setOutput('source_sha', run.head_sha);

  signed-pair:
    needs: [release-source]
    if: ${{ github.ref == 'refs/heads/main' && needs.release-source.outputs.source_sha != '' }}
    environment: android-signing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TRAINPILOT_SOURCE_SHA: ${{ needs.release-source.outputs.source_sha }}
      TRAINPILOT_MAPS_API_KEY: ${{ secrets.TRAINPILOT_MAPS_API_KEY || secrets.MAPS_API_KEY }}
      TRAINPILOT_REQUIRE_WEAR_PAIR: 'true'
      TRAINPILOT_VERIFY_RELEASE: 'true'
      TRAINPILOT_RELEASE_CERT_SHA256: ${{ secrets.TRAINPILOT_RELEASE_CERT_SHA256 }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-source.outputs.source_sha }}
          persist-credentials: false

      - name: Validate release APK verification script syntax
        run: python3 -m py_compile scripts/verify_android_apk_metadata.py

      - name: Set up JDK 25 LTS
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android API 37.1 stable SDK
        shell: bash
        run: bash scripts/install_android_build_sdk.sh

      - name: Set up Gradle 9.9.3 (repo has no gradlew launcher)
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.9.3'
          # Signed main builds seed the default-branch cache for future main/PR builds.
          # No configuration-cache encryption key is supplied: setup-gradle will not
          # persist project configuration (which may contain signing credentials).
          cache-read-only: false

      - name: Restore private signing file into runner temporary directory
        env:
          KEYSTORE_BASE64: ${{ secrets.TRAINPILOT_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          required = ['KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_PASSWORD', 'TRAINPILOT_RELEASE_CERT_SHA256', 'TRAINPILOT_MAPS_API_KEY']
          missing = [key for key in required if not os.environ.get(key, '').strip()]
          if missing:
              raise SystemExit('Missing configuration names: ' + ', '.join(missing))
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'trainpilot-release.jks'
          with target.open('xb') as output:
              target.chmod(0o600)
              output.write(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('KEYSTORE_PATH=' + str(target) + '\n')
          PY

      - name: Build signed phone and Wear pair
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUILD_AAB: ${{ github.event_name != 'workflow_dispatch' || inputs.build_aab }}
        shell: bash
        run: |
          tasks=(:app:assembleRelease :wear:assembleRelease)
          if [[ "$BUILD_AAB" == "true" ]]; then
            tasks+=(:app:bundleRelease :wear:bundleRelease)
          fi
          gradle --no-daemon --stacktrace --profile --continue "${tasks[@]}"

      - name: Verify package, embedded Maps configuration and pinned signer
        run: python3 scripts/verify_android_apk_metadata.py

      - name: Verify signed AABs and write Play metadata
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_aab }}
        shell: bash
        run: |
          set -euo pipefail
          PHONE="app/build/outputs/bundle/release/app-release.aab"
          WEAR="wear/build/outputs/bundle/release/wear-release.aab"
          test -s "$PHONE"
          test -s "$WEAR"
          jarsigner -verify "$PHONE"
          jarsigner -verify "$WEAR"
          python3 - <<'PY'
          import os, re, subprocess
          expected = os.environ.get('TRAINPILOT_RELEASE_CERT_SHA256', '').replace(':', '').lower().strip()
          if len(expected) != 64:
              raise SystemExit('Pinned release certificate SHA-256 missing')
          for bundle in ('app/build/outputs/bundle/release/app-release.aab', 'wear/build/outputs/bundle/release/wear-release.aab'):
              out = subprocess.check_output(['keytool', '-printcert', '-jarfile', bundle], text=True, stderr=subprocess.STDOUT)
              match = re.search(r'SHA256:\s*([0-9A-Fa-f:]+)', out)
              if not match:
                  raise SystemExit(f'Unable to read signer SHA-256 from {bundle}')
              actual = match.group(1).replace(':', '').lower()
              if actual != expected:
                  raise SystemExit(f'AAB signer differs from pinned TrainPilot release key: {bundle}')
          print('AAB signatures verified against pinned TrainPilot upload certificate.')
          PY
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          def field(module, name):
              src = pathlib.Path(module, 'build.gradle.kts').read_text()
              m = re.search(rf'(?m)^\s*{name}\s*=\s*(\d+|"[^"\n]+")', src)
              if not m:
                  raise SystemExit(f'Missing {module} {name}')
              return m.group(1).strip('"')
          phone = pathlib.Path('app/build/outputs/bundle/release/app-release.aab')
          wear = pathlib.Path('wear/build/outputs/bundle/release/wear-release.aab')
          meta = {
              'commit': __import__('os').environ.get('TRAINPILOT_SOURCE_SHA'),
              'applicationId': 'com.TrainPilot.com',
              'versionName': field('app', 'versionName'),
              'mobileVersionCode': int(field('app', 'versionCode')),
              'wearVersionCode': int(field('wear', 'versionCode')),
              'mobileAabSha256': hashlib.sha256(phone.read_bytes()).hexdigest(),
              'wearAabSha256': hashlib.sha256(wear.read_bytes()).hexdigest(),
              'mobileBytes': phone.stat().st_size,
              'wearBytes': wear.stat().st_size,
          }
          if meta['mobileVersionCode'] == meta['wearVersionCode']:
              raise SystemExit('Phone and Wear versionCode must be unique for Play form-factor releases')
          pathlib.Path('app/build/outputs/play-aab-metadata.json').write_text(json.dumps(meta, indent=2) + '\n')
          print(json.dumps(meta, indent=2))
          PY

      - name: Remove temporary private signing file
        if: always()
        shell: bash
        run: rm -f -- "${RUNNER_TEMP}/trainpilot-release.jks"

      - name: Stage verified signed APKs and public metadata
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: staged-signed-apk-pair
          path: |
            app/build/outputs/apk/release/app-release.apk
            wear/build/outputs/apk/release/wear-release.apk
            app/build/outputs/apk-verification.json
          if-no-files-found: error
          retention-days: 1

      - name: Stage signed Play Console AAB pair
        if: ${{ success() && (github.event_name != 'workflow_dispatch' || inputs.build_aab) }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: staged-play-aab-pair
          path: |
            app/build/outputs/bundle/release/app-release.aab
            wear/build/outputs/bundle/release/wear-release.aab
            app/build/outputs/play-aab-metadata.json
          if-no-files-found: error
          retention-days: 1

      - name: Upload Gradle task timing profile
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trainpilot-build-profile
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  jvm-shards:
    # Independent trusted-source test shards; no signing environment or keystore.
    name: Signed-source JVM regressions (${{ matrix.suite }})
    needs: [release-source]
    if: ${{ github.ref == 'refs/heads/main' && needs.release-source.outputs.source_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: [phone-a, phone-b, wear-shared]
    env:
      TRAINPILOT_SOURCE_SHA: ${{ needs.release-source.outputs.source_sha }}
      TRAINPILOT_MAPS_API_KEY: ${{ secrets.TRAINPILOT_MAPS_API_KEY || secrets.MAPS_API_KEY }}
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-source.outputs.source_sha }}
          persist-credentials: false

      - name: Verify trusted source checkout
        run: test "$(git rev-parse HEAD)" = "$TRAINPILOT_SOURCE_SHA"

      - name: Set up JDK 25 LTS
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify SDK installer fast-path and fallback contract
        if: matrix.suite == 'phone-a'
        run: bash scripts/test_install_android_build_sdk.sh

      - name: Install Android API 37.1 stable SDK
        shell: bash
        run: bash scripts/install_android_build_sdk.sh

      - name: Set up Gradle 9.9.3 (repo has no gradlew launcher)
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.9.3'
          cache-read-only: false

      - name: Cache Robolectric Android SDK dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-sdks-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'scripts/prefetch_robolectric_sdk.py') }}
          restore-keys: |
            robolectric-api34-i7-v1-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Fetch checksum-verified Robolectric SDK with retries
        shell: bash
        run: python3 scripts/prefetch_robolectric_sdk.py

      - name: Verify complete bundled font glyphs and real weights
        if: matrix.suite == 'phone-a'
        run: python3 scripts/verify_font_glyphs.py

      - name: Check embedded video user gesture and failure callbacks
        if: matrix.suite == 'phone-a'
        run: node --test scripts/test_exercise_video_player.mjs

      - name: Compile and run module JVM tests
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
          WEAR_CLOSURE_REGRESSIONS: 'false'
          TARGETED_REGRESSIONS: 'false'
        run: bash scripts/run_jvm_regression_shard.sh

      - name: Stage raw JVM outputs with module paths
        if: always()
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
        run: bash scripts/stage_jvm_regression_shard.sh

      - name: Upload shard raw JVM reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trainpilot-jvm-shard-${{ matrix.suite }}-attempt-${{ github.run_attempt }}
          path: ci-jvm-results/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Gradle task timing profile
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trainpilot-signing-test-profile-${{ matrix.suite }}-attempt-${{ github.run_attempt }}
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  jvm-tests:
    # Preserve the single authoritative all-module raw XML gate.
    name: Full JVM regressions
    needs: [release-source, jvm-shards]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && needs.release-source.result == 'success' && needs.release-source.outputs.source_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-source.outputs.source_sha }}
          persist-credentials: false

      - name: Verify trusted source checkout
        env:
          TRAINPILOT_SOURCE_SHA: ${{ needs.release-source.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$TRAINPILOT_SOURCE_SHA"

      - name: Download JVM shard artifacts separately
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: trainpilot-jvm-shard-*
          path: ci-shards/
          merge-multiple: false

      - name: Verify shared shard command and assembler contracts
        run: |
          python3 scripts/test_jvm_shard_commands.py
          python3 scripts/test_assemble_jvm_shards.py

      - name: Assemble disjoint raw XML from the exact checkout
        env:
          TARGETED_RUN: 'false'
        run: python3 scripts/assemble_jvm_shards.py --root ci-shards --checkout "$(git rev-parse HEAD)" --attempt "$GITHUB_RUN_ATTEMPT" --targeted "$TARGETED_RUN"

      - name: Verify raw phone, Wear and shared JUnit XML test results
        if: always()
        env:
          TRAINPILOT_SOURCE_SHA: ${{ needs.release-source.outputs.source_sha }}
          TRAINPILOT_REQUIRE_NO_SKIPS: 'true'
        run: python3 scripts/verify_junit_xml.py

      - name: Require every test shard job to succeed
        if: always()
        env:
          SHARD_RESULT: ${{ needs.jvm-shards.result }}
        run: test "$SHARD_RESULT" = success

      - name: Stage canonical all-module raw evidence
        if: always()
        shell: bash
        run: |
          mkdir -p ci-verified-jvm
          for path in app/build/test-results/testDebugUnitTest wear/build/test-results/testDebugUnitTest shared/build/test-results/testDebugUnitTest app/build/outputs/junit-verification.json ci-evidence; do
            if [[ -e "$path" ]]; then cp -a --parents "$path" ci-verified-jvm/; fi
          done

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trainpilot-persistent-signing-test-reports
          path: ci-verified-jvm/
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified signed pair
    needs: [release-source, jvm-tests, signed-pair]
    if: ${{ github.ref == 'refs/heads/main' && needs.release-source.outputs.source_sha != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download staged signed APK pair
        uses: actions/download-artifact@v8.0.2
        with:
          name: staged-signed-apk-pair
          path: dist/apk

      - name: Upload verified signed APKs and public metadata
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trainpilot-persistent-signed-apk-pair
          path: dist/apk/
          if-no-files-found: error
          retention-days: 7

      - name: Download staged Play Console AAB pair
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_aab }}
        uses: actions/download-artifact@v8.0.2
        with:
          name: staged-play-aab-pair
          path: dist/aab

      - name: Upload signed Play Console AAB pair
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_aab }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trainpilot-play-internal-aab-pair
          path: dist/aab/
          if-no-files-found: error
          retention-days: 7
