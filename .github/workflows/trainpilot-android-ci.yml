name: TrainPilot Native Android CI and Debug APK

on:
  pull_request:
    paths:
      - 'app/**'
      - 'wear/**'
      - 'shared/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/verify_android_apk_metadata.py'
      - 'scripts/prefetch_robolectric_sdk.py'
      - '.github/workflows/trainpilot-android-ci.yml'
  workflow_dispatch:
    inputs:
      wear_closure_regressions:
        description: 'Check pending Wear closure receipts and phone discard recovery'
        type: boolean
        default: false
      targeted_regressions:
        description: 'Run the device-reported progress/health regressions before main integration'
        type: boolean
        default: false

concurrency:
  group: native-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-build:
    name: Compile, unit tests, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TRAINPILOT_REQUIRE_WEAR_PAIR: "true"
      TRAINPILOT_MAPS_API_KEY: ${{ secrets.TRAINPILOT_MAPS_API_KEY || secrets.MAPS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36 SDK from hosted runner
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "${SDKMANAGER}"
          echo "Using ${SDKMANAGER}"
          "${SDKMANAGER}" --version
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" --install 'platforms;android-36' 'build-tools;36.0.0'
          # AGP 9.1 requests compileSdk 36.1; install it when listed.
          "${SDKMANAGER}" --install 'platforms;android-36.1' || true

      - name: Set up Gradle 9.3.1 (repo has no gradlew launcher)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Cache Robolectric Android SDK dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-api34-i7-v1-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Fetch checksum-verified Robolectric SDK with retries
        shell: bash
        run: python3 scripts/prefetch_robolectric_sdk.py

      - name: Create temporary CI debug signing key
        shell: bash
        run: |
          keytool -genkeypair -v -keystore debug.keystore             -storepass android -keypass android             -alias androiddebugkey -keyalg RSA -keysize 2048             -validity 10000             -dname 'CN=Android Debug,O=Android,C=US' -noprompt
          # This key is CI-only. A CI APK will not update an APK signed with a different key.

      - name: Build debug APK and run JVM tests
        shell: bash
        env:
          WEAR_CLOSURE_REGRESSIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.wear_closure_regressions }}
          TARGETED_REGRESSIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.targeted_regressions }}
        run: |
          if [[ "$WEAR_CLOSURE_REGRESSIONS" == "true" ]]; then
            gradle --no-daemon --stacktrace --continue :app:assembleDebug :wear:assembleDebug :wear:assembleOptimized \
              :app:testDebugUnitTest --tests 'com.example.WatchDiscardRecoveryRegressionTest' \
              --tests 'com.example.PhoneReturnInstallationRegressionTest' --tests 'com.example.HealthSyncAdmissionRegressionTest' \
              :wear:testDebugUnitTest --tests 'com.repforge.app.wear.WearClosureRecoveryTest' \
              --tests 'com.repforge.app.wear.WearSaveSyncTest' --tests 'com.repforge.app.wear.WorkoutOwnership193Test'
          elif [[ "$TARGETED_REGRESSIONS" == "true" ]]; then
            gradle --no-daemon --stacktrace --continue :app:assembleDebug :wear:assembleDebug :wear:assembleOptimized :app:testDebugUnitTest \
              --tests 'com.example.StudioProgress*' \
              --tests 'com.example.StudioHealthPermissionActionTest' \
              --tests 'com.example.StudioAppearanceRegressionTest' \
              --tests 'com.example.StudioCloudRefreshRegressionTest' \
              --tests 'com.example.JournalWorkoutHealthRegressionTest' \
              --tests 'com.example.LegacyRestoreEvidenceRegressionTest' \
              --tests 'com.example.PhoneReturnInstallationRegressionTest' \
              --tests 'com.example.HealthProviderSelectionRegressionTest' \
              --tests 'com.example.HealthSyncAdmissionRegressionTest'
          else
            gradle --no-daemon --stacktrace --continue :app:assembleDebug :app:testDebugUnitTest :wear:assembleDebug :wear:assembleOptimized :wear:testDebugUnitTest :shared:testDebugUnitTest
          fi

      - name: Verify raw phone, Wear and shared JUnit XML test results
        if: always()
        shell: bash
        run: python3 scripts/verify_junit_xml.py

      - name: Report Maps configuration and APK signer without exposing the key
        if: always()
        shell: bash
        run: python3 scripts/verify_android_apk_metadata.py

      - name: Upload APK configuration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainpilot-apk-metadata
          path: app/build/outputs/apk-verification.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload debug APK if produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainpilot-debug-ci-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload paired Wear debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainpilot-wear-debug-ci-apk
          path: wear/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload optimized paired Wear test APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainpilot-wear-optimized-test-apk
          path: wear/build/outputs/apk/optimized/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainpilot-jvm-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            wear/build/reports/tests/
            wear/build/test-results/
            shared/build/reports/tests/
            shared/build/test-results/
            app/build/outputs/junit-verification.json
          if-no-files-found: ignore
          retention-days: 7
