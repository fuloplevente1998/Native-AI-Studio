name: TrainPilot Native Android CI and Debug APK

on:
  pull_request:
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/trainpilot-android-ci.yml'
  workflow_dispatch:

concurrency:
  group: native-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-build:
    name: Compile, unit tests, debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36 SDK from hosted runner
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "${SDKMANAGER}"
          echo "Using ${SDKMANAGER}"
          "${SDKMANAGER}" --version
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" --install 'platforms;android-36' 'build-tools;36.0.0'
          # AGP 9.1 requests compileSdk 36.1; install it when listed.
          "${SDKMANAGER}" --install 'platforms;android-36.1' || true

      - name: Set up Gradle 9.3.1 (repo has no gradlew launcher)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary CI debug signing key
        shell: bash
        run: |
          keytool -genkeypair -v -keystore debug.keystore             -storepass android -keypass android             -alias androiddebugkey -keyalg RSA -keysize 2048             -validity 10000             -dname 'CN=Android Debug,O=Android,C=US' -noprompt
          # This key is CI-only. A CI APK will not update an APK signed with a different key.

      - name: Build debug APK and run JVM tests
        shell: bash
        run: gradle --no-daemon --stacktrace --continue :app:assembleDebug :app:testDebugUnitTest

      - name: Upload debug APK if produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainpilot-debug-ci-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trainpilot-jvm-test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
