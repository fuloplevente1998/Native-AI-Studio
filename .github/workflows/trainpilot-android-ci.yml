name: TrainPilot Liquid Glass 2 G6 isolated phone APK

on:
  pull_request:
    branches: [test/liquid-glass-2-g6-base]

permissions:
  contents: read

concurrency:
  group: glass2-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  glass2-test-apk:
    if: github.head_ref == 'test/liquid-glass-2-g6-apk' && github.base_ref == 'test/liquid-glass-2-g6-base'
    name: Isolated Liquid Glass 2 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
          "$SDKMANAGER" --install 'platforms;android-36.1' || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: true
      - name: Generate disposable debug signer
        shell: bash
        run: |
          test ! -e debug.keystore
          keytool -genkeypair -keystore debug.keystore -storetype JKS -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 365 -dname "CN=TrainPilot Liquid Glass 2 Test"
      - name: Build isolated phone APK
        run: gradle --no-daemon --stacktrace -PtrainpilotGlass2Test=true :app:assembleDebug
      - name: Verify package, label and signing certificate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p glass2-test-output
          apk=glass2-test-output/TrainPilot-Glass2-Test.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$aapt" dump badging "$apk" > glass2-test-output/apk-metadata.txt
          grep -F "package: name='com.TrainPilot.com.glass2test'" glass2-test-output/apk-metadata.txt
          grep -F "application-label:'TrainPilot Glass 2 Test'" glass2-test-output/apk-metadata.txt
          grep -F -- "-glass2-test'" glass2-test-output/apk-metadata.txt
          "$apksigner" verify --print-certs "$apk" >> glass2-test-output/apk-metadata.txt
          grep -F "CN=TrainPilot Liquid Glass 2 Test" glass2-test-output/apk-metadata.txt
          git rev-parse HEAD > glass2-test-output/source-sha.txt
          (cd glass2-test-output && sha256sum TrainPilot-Glass2-Test.apk > SHA256SUMS)
      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: TrainPilot-Glass2-Test
          path: glass2-test-output/
          if-no-files-found: error
          retention-days: 7
      - name: Remove test key
        if: always()
        run: rm -f -- debug.keystore
