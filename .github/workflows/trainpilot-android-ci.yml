name: TrainPilot Native Android Regression Tests

on:
  # Main pushes run the full gate before an automatically signed release pair.
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'wear/**'
      - 'shared/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/**'
      - '.github/workflows/trainpilot-android-ci.yml'
      - '.github/workflows/trainpilot-persistent-signing.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'wear/**'
      - 'shared/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'scripts/verify_android_apk_metadata.py'
      - 'scripts/verify_junit_xml.py'
      - 'scripts/prefetch_robolectric_sdk.py'
      - 'scripts/install_android_build_sdk.sh'
      - 'scripts/test_install_android_build_sdk.sh'
      - 'scripts/ci_phone_test_shard_b.txt'
      - 'scripts/assemble_jvm_shards.py'
      - 'scripts/test_assemble_jvm_shards.py'
      - '.github/workflows/trainpilot-android-ci.yml'
  workflow_dispatch:
    inputs:
      wear_closure_regressions:
        description: 'Check pending Wear closure receipts and phone discard recovery'
        type: boolean
        default: false
      targeted_regressions:
        description: 'Run the device-reported progress/health regressions before main integration'
        type: boolean
        default: false

concurrency:
  group: native-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm-shards:
    name: JVM regressions (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON((github.event_name == 'workflow_dispatch' && (inputs.wear_closure_regressions || inputs.targeted_regressions)) && '["phone-a","wear-shared"]' || '["phone-a","phone-b","wear-shared"]') }}
    env:
      TRAINPILOT_MAPS_API_KEY: ${{ secrets.TRAINPILOT_MAPS_API_KEY || secrets.MAPS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 25 LTS
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify SDK installer fast-path and fallback contract
        if: matrix.suite == 'phone-a'
        run: bash scripts/test_install_android_build_sdk.sh

      - name: Install Android API 37.1 stable SDK
        shell: bash
        run: bash scripts/install_android_build_sdk.sh

      - name: Set up Gradle 9.9.3 (repo has no gradlew launcher)
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.9.3'
          cache-read-only: false

      - name: Cache Robolectric Android SDK dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-sdks-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'scripts/prefetch_robolectric_sdk.py') }}
          restore-keys: |
            robolectric-api34-i7-v1-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Fetch checksum-verified Robolectric SDK with retries
        shell: bash
        run: python3 scripts/prefetch_robolectric_sdk.py

      - name: Verify complete bundled font glyphs and real weights
        if: matrix.suite == 'phone-a'
        run: python3 scripts/verify_font_glyphs.py

      - name: Check embedded video user gesture and failure callbacks
        if: matrix.suite == 'phone-a'
        run: node --test scripts/test_exercise_video_player.mjs

      - name: Compile and run module JVM tests
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
          WEAR_CLOSURE_REGRESSIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.wear_closure_regressions }}
          TARGETED_REGRESSIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.targeted_regressions }}
        run: |
          common=(--no-daemon --stacktrace --profile --continue)
          if [[ "$SUITE" == phone-* ]]; then
            if [[ "$WEAR_CLOSURE_REGRESSIONS" == "true" ]]; then
              gradle "${common[@]}" :app:testDebugUnitTest --tests 'com.example.WatchDiscardRecoveryRegressionTest' \
                --tests 'com.example.PhoneReturnInstallationRegressionTest' --tests 'com.example.HealthSyncAdmissionRegressionTest'
            elif [[ "$TARGETED_REGRESSIONS" == "true" ]]; then
              gradle "${common[@]}" :app:testDebugUnitTest \
                --tests 'com.example.ActiveWorkoutDockNavigationRegressionTest' \
                --tests 'com.example.StudioProgress*' \
                --tests 'com.example.StudioHealthPermissionActionTest' \
                --tests 'com.example.StudioAppearanceRegressionTest' \
                --tests 'com.example.StudioCloudRefreshRegressionTest' \
                --tests 'com.example.JournalWorkoutHealthRegressionTest' \
                --tests 'com.example.LegacyRestoreEvidenceRegressionTest' \
                --tests 'com.example.PhoneReturnInstallationRegressionTest' \
                --tests 'com.example.HealthProviderSelectionRegressionTest' \
                --tests 'com.example.HealthSyncAdmissionRegressionTest'
            else
              gradle "${common[@]}" "-PtrainpilotPhoneTestShard=${SUITE#phone-}" :app:testDebugUnitTest
            fi
          elif [[ "$WEAR_CLOSURE_REGRESSIONS" == "true" ]]; then
            gradle "${common[@]}" :wear:testDebugUnitTest --tests 'com.repforge.app.wear.WearClosureRecoveryTest' \
              --tests 'com.repforge.app.wear.WearSaveSyncTest' --tests 'com.repforge.app.wear.WorkoutOwnership193Test' :shared:testDebugUnitTest
          else
            gradle "${common[@]}" :wear:testDebugUnitTest :shared:testDebugUnitTest
          fi

      - name: Stage raw JVM outputs with module paths
        if: always()
        shell: bash
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          mkdir -p ci-jvm-results/ci-evidence
          if [[ "$SUITE" == phone-* ]]; then modules=(app); else modules=(wear shared); fi
          for module in "${modules[@]}"; do
            for dir in "$module/build/test-results" "$module/build/reports/tests"; do
              if [[ -d "$dir" ]]; then cp -a --parents "$dir" ci-jvm-results/; fi
            done
          done
          git rev-parse HEAD > "ci-jvm-results/ci-evidence/$SUITE.sha"

      - name: Upload shard raw JVM reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trainpilot-jvm-shard-${{ matrix.suite }}-attempt-${{ github.run_attempt }}
          path: ci-jvm-results/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Gradle task timing profile
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trainpilot-build-profile-${{ matrix.suite }}-attempt-${{ github.run_attempt }}
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  android-build:
    # Preserve the single authoritative all-module raw XML gate.
    name: Compile and full JVM regressions
    needs: [jvm-shards]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download JVM shard artifacts separately
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: trainpilot-jvm-shard-*
          path: ci-shards/
          merge-multiple: false

      - name: Verify shard assembler contract
        run: python3 scripts/test_assemble_jvm_shards.py

      - name: Assemble disjoint raw XML from the exact checkout
        env:
          TARGETED_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.wear_closure_regressions || inputs.targeted_regressions) }}
        run: python3 scripts/assemble_jvm_shards.py --root ci-shards --checkout "$(git rev-parse HEAD)" --attempt "$GITHUB_RUN_ATTEMPT" --targeted "$TARGETED_RUN"

      - name: Verify raw phone, Wear and shared JUnit XML test results
        if: always()
        env:
          TRAINPILOT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TRAINPILOT_REQUIRE_NO_SKIPS: ${{ !( github.event_name == 'workflow_dispatch' && (inputs.wear_closure_regressions || inputs.targeted_regressions) ) }}
        run: python3 scripts/verify_junit_xml.py

      - name: Require every test shard job to succeed
        if: always()
        env:
          SHARD_RESULT: ${{ needs.jvm-shards.result }}
        run: test "$SHARD_RESULT" = success

      - name: Stage canonical all-module raw evidence
        if: always()
        shell: bash
        run: |
          mkdir -p ci-verified-jvm
          for path in app/build/test-results/testDebugUnitTest wear/build/test-results/testDebugUnitTest shared/build/test-results/testDebugUnitTest app/build/outputs/junit-verification.json ci-evidence; do
            if [[ -e "$path" ]]; then cp -a --parents "$path" ci-verified-jvm/; fi
          done

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trainpilot-jvm-test-reports
          path: ci-verified-jvm/
          if-no-files-found: error
          retention-days: 7

  release-r8:
    # Separate phone and Wear optimizers on independent runners.
    name: Release R8 minification check (${{ matrix.module }})
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.wear_closure_regressions || inputs.targeted_regressions)) }}
    strategy:
      fail-fast: false
      matrix:
        module: [app, wear]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TRAINPILOT_MAPS_API_KEY: ${{ secrets.TRAINPILOT_MAPS_API_KEY || secrets.MAPS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 25 LTS
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Android API 37.1 stable SDK
        shell: bash
        run: bash scripts/install_android_build_sdk.sh

      - name: Set up Gradle 9.9.3 (repo has no gradlew launcher)
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.9.3'
          cache-read-only: false

      - name: Run release R8 minification
        shell: bash
        env:
          MODULE: ${{ matrix.module }}
        run: gradle --no-daemon --stacktrace --profile ":${MODULE}:minifyReleaseWithR8"

      - name: Upload R8 Gradle task timing profile
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trainpilot-r8-build-profile-${{ matrix.module }}
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7

  kyant-debug-dex:
    # Compatibility gate, not an installable test artifact or production signing job.
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.wear_closure_regressions || inputs.targeted_regressions)) }}
    name: Kyant debug DEX compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Install Android API 37.1 stable SDK
        shell: bash
        run: bash scripts/install_android_build_sdk.sh
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.9.3'
          cache-read-only: true
      - name: Verify debug D8 dexing without signing
        run: gradle --no-daemon --stacktrace --profile :app:dexBuilderDebug :app:mergeExtDexDebug

      - name: Upload DEX Gradle task timing profile
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trainpilot-dex-build-profile
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 7
